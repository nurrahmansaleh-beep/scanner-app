<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Scanner DO Balik</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h3 { margin-top: 0; color: #1a73e8; margin-bottom: 5px; }
    
    .camera-wrapper { position: relative; width: 100%; height: 240px; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; }
    
    .scan-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 75%; height: 40px; border: 3px solid #ff9800; border-radius: 6px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5); pointer-events: none;
    }
    
    .btn-main { background: #1a73e8; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; margin-bottom: 10px; }
    .btn-main:active { background: #1557b0; }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }
    
    #status { font-weight: bold; margin: 10px 0; color: #333; font-size: 14px; }
    
    #ocrDebug { font-size: 13px; color: #333; background: #fff; padding: 10px; border-radius: 8px; border: 2px dashed #ff9800; margin-top: 10px; display: none; }
    #debugCanvasImage { width: 100%; max-height: 50px; object-fit: contain; margin-top: 6px; border: 1px solid #ddd; }
    
    /* Section Riwayat */
    .history-title { text-align: left; margin: 20px 0 10px 0; font-size: 16px; color: #333; border-bottom: 2px solid #1a73e8; padding-bottom: 5px; font-weight:bold; }
    
    /* Panel Kontrol Massal (Diperbarui) */
    .bulk-controls { display: flex; flex-direction: column; gap: 12px; background: #fff; border: 1px solid #cce5ff; padding: 14px; border-radius: 10px; margin-bottom: 15px; }
    .bulk-header { display: flex; justify-content: space-between; align-items: center; }
    .select-all-wrap { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #333; cursor: pointer; }
    .select-all-wrap input { width: 18px; height: 18px; cursor: pointer; }
    
    /* Input Tanggal Terpusat */
    .bulk-date-wrap { display: flex; align-items: center; gap: 6px; background: #f0f7ff; padding: 6px 10px; border-radius: 8px; border: 1px solid #b8daff; }
    .bulk-date-wrap label { font-size: 12px; font-weight: bold; color: #1a73e8; }
    .bulk-date-wrap input { font-family: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; outline: none; background: #fff; color:#333; }
    
    .btn-save-bulk { background: #28a745; color: white; border: none; padding: 12px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; width: 100%; }
    .btn-save-bulk:disabled { background: #a5d8b2; cursor: not-allowed; }

    /* Result Card (Tanpa Tanggal) */
    .result-card { background: #e8f0fe; border: 1px solid #1a73e8; padding: 14px; border-radius: 12px; text-align: left; margin-bottom: 15px; position: relative; }
    .result-card.saved { background: #f0f0f0; border-color: #ccc; opacity: 0.8; }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-title-wrap { display: flex; align-items: flex-start; gap: 8px; }
    .card-title-wrap input { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; }
    .result-card h4 { margin: 0; color: #1a73e8; font-size: 15px; line-height: 1.4; }
    .result-card.saved h4 { color: #555; }
    
    .btn-delete { background: none; border: none; font-size: 18px; cursor: pointer; padding: 0; margin: 0; color: #dc3545; }

    .info-table { background: white; padding: 10px; border-radius: 8px; font-size: 12px; border: 1px solid #cce5ff; }
    .info-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #e0e0e0; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #555; width: 45%; }
    .info-value { color: #111; width: 55%; font-weight: bold; text-align: right; word-break: break-word; }
  </style>
</head>
<body>

  <div class="container">
    <h3>Scanner DO Balik</h3>
    <p style="font-size: 12px; color: #666; margin-top:0;">Posisikan ID di kotak oranye, lalu tekan potret.</p>

    <div class="camera-wrapper">
      <video id="videoElement" autoplay playsinline muted></video>
      <div class="scan-box" id="scanBox"></div>
    </div>
    
    <button class="btn-main" id="btnStart" onclick="startCamera()">📷 BUKA / AKTIFKAN KAMERA</button>
    <button class="btn-main" id="btnSnap" onclick="takeSnapAndScan()" style="display:none; background:#28a745;">📸 POTRET & SCAN</button>

    <canvas id="canvasElement" style="display:none;"></canvas>

    <div id="status">Tekan tombol biru untuk mengaktifkan kamera.</div>
    
    <div id="ocrDebug">
      <b>Teks Hasil Saringan:</b> <span id="debugText" style="color:#28a745; font-weight:bold; font-size:15px;">-</span><br>
      <small style="color:#666;">Potongan gambar:</small><br>
      <img id="debugCanvasImage" alt="Potongan OCR">
    </div>
    
    <!-- Wadah Riwayat Hasil Scan -->
    <div id="historySection" style="display:none;">
      <div class="history-title">📋 Riwayat Scan (Sesi Ini)</div>
      
      <!-- Kontrol Massal dengan Tanggal Terpusat -->
      <div class="bulk-controls" id="bulkControls">
        <div class="bulk-header">
          <label class="select-all-wrap">
            <input type="checkbox" id="checkAll" onchange="toggleSelectAll(this.checked)">
            Pilih Semua (<span id="selectedCount">0</span>)
          </label>
          <div class="bulk-date-wrap">
            <label>📅 Tgl Serah Terima:</label>
            <input type="date" id="bulkDate">
          </div>
        </div>
        <button class="btn-save-bulk" id="btnSaveBulk" onclick="saveSelectedItems()" disabled>💾 Simpan Terpilih ke Paxel</button>
      </div>

      <div id="resultsContainer"></div>
    </div>
  </div>

  <script>
    // Inisialisasi Tanggal Hari Ini ke Input Bulk Date
    document.addEventListener("DOMContentLoaded", () => {
      const localDate = new Date();
      const offset = localDate.getTimezoneOffset() * 60000;
      const today = new Date(localDate.getTime() - offset).toISOString().split('T')[0];
      document.getElementById('bulkDate').value = today;
    });

    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');
    const statusEl = document.getElementById('status');
    const ocrDebugEl = document.getElementById('ocrDebug');
    const debugTextEl = document.getElementById('debugText');
    const debugCanvasImage = document.getElementById('debugCanvasImage');
    const btnStart = document.getElementById('btnStart');
    const btnSnap = document.getElementById('btnSnap');
    const ctx = canvas.getContext('2d');
    
    let currentStream = null;
    let scannedHistory = []; 

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15); 
      } catch (e) {}
    }

    async function startCamera() {
      statusEl.innerText = "⌛ Meminta akses kamera...";
      btnStart.disabled = true;

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const tryConstraints = [
        { video: { facingMode: "environment" } },
        { video: { facingMode: "user" } },
        { video: true }
      ];

      let stream = null;
      for (let constraints of tryConstraints) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (err) {}
      }

      if (!stream) {
        btnStart.disabled = false;
        statusEl.innerText = "❌ Kamera gagal diakses.";
        return;
      }

      currentStream = stream;
      video.srcObject = stream;
      
      await new Promise((resolve) => {
        video.onloadedmetadata = () => { video.play().then(resolve).catch(resolve); };
      });
      
      statusEl.innerText = "🟢 Kamera aktif! Posisikan ID di kotak.";
      btnStart.style.display = 'none';
      btnSnap.style.display = 'block';
    }

    async function takeSnapAndScan() {
      btnSnap.disabled = true;
      statusEl.innerText = "⚙️ Memotong gambar & membaca teks...";
      ocrDebugEl.style.display = 'none';

      const vW = video.videoWidth || 640;
      const vH = video.videoHeight || 480;
      const cropW = vW * 0.75; 
      const cropH = vH * 0.12;
      const cropX = (vW - cropW) / 2;
      const cropY = (vH - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;
      ctx.filter = 'grayscale(100%) contrast(250%) brightness(130%)';
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      
      const imageDataURL = canvas.toDataURL('image/jpeg', 0.9);
      debugCanvasImage.src = imageDataURL;
      ocrDebugEl.style.display = 'block';

      try {
        const { data: { text } } = await Tesseract.recognize(imageDataURL, 'eng');
        let rawText = text ? text.replace(/\n/g, ' ').trim() : '';

        let cleanIdText = "";
        const idPattern = rawText.match(/[A-Z0-9\-]{5,}/g);
        if (idPattern && idPattern.length > 0) { cleanIdText = idPattern[0]; }

        debugTextEl.innerText = cleanIdText || "[Tidak ada ID Valid]";

        if (!cleanIdText) {
          statusEl.innerText = "❌ ID tidak terbaca. Pastikan foto tidak blur.";
          btnSnap.disabled = false; return;
        }

        statusEl.innerText = "🔍 Mencari ID di Spreadsheet...";

        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'liveTextScan', ocrText: cleanIdText })
        });
        
        const responseText = await response.text();
        let resData = JSON.parse(responseText);

        if (!response.ok || !resData.success) throw new Error(resData.message || "Gagal memproses data.");

        if (resData.matches && resData.matches.length > 0) {
          playBeepSound();
          statusEl.innerText = "⚡ Data Ditemukan!";
          
          scannedHistory.unshift({
            id: Date.now(),
            matchedData: resData.matches[0],
            saved: false,
            selected: true // Otomatis tercentang saat baru discan
          });

          renderHistory();
        } else {
          statusEl.innerText = "❌ ID (" + cleanIdText + ") tidak ada di Master Data.";
        }
      } catch (e) {
        statusEl.innerText = "❌ Error: " + e.message;
      } finally {
        btnSnap.disabled = false;
      }
    }

    // --- FITUR MULTI SELECT & DELETE ---

    function toggleSelectAll(isChecked) {
      scannedHistory.forEach(item => {
        if (!item.saved) item.selected = isChecked;
      });
      renderHistory();
    }

    function toggleItemSelection(id, isChecked) {
      const item = scannedHistory.find(x => x.id === id);
      if (item) item.selected = isChecked;
      renderHistory();
    }

    function deleteItem(id) {
      if(confirm("Hapus dokumen ini dari riwayat scan?")) {
        scannedHistory = scannedHistory.filter(x => x.id !== id);
        renderHistory();
      }
    }

    // --- RENDER UI ---

    function renderHistory() {
      const historySection = document.getElementById('historySection');
      const container = document.getElementById('resultsContainer');
      
      if (scannedHistory.length === 0) {
        historySection.style.display = 'none';
        return;
      }

      historySection.style.display = 'block';

      // Update Panel Bulk Controls
      const unsavedItems = scannedHistory.filter(x => !x.saved);
      const selectedCount = unsavedItems.filter(x => x.selected).length;
      const allSelected = unsavedItems.length > 0 && selectedCount === unsavedItems.length;

      document.getElementById('checkAll').checked = allSelected;
      document.getElementById('checkAll').disabled = unsavedItems.length === 0;
      document.getElementById('selectedCount').innerText = selectedCount;
      document.getElementById('btnSaveBulk').disabled = selectedCount === 0;

      let html = '';
      scannedHistory.forEach((item, index) => {
        const data = item.matchedData;
        const firstSixColumns = Object.entries(data).slice(0, 6);
        let infoRowsHTML = '';
        
        firstSixColumns.forEach(([headerName, value]) => {
          if (headerName && headerName.trim() !== '') {
            infoRowsHTML += `<div class="info-row"><div class="info-label">${headerName}</div><div class="info-value">${value || '-'}</div></div>`;
          }
        });

        const cardClass = item.saved ? "result-card saved" : "result-card";
        const displayNumber = scannedHistory.length - index;

        html += `
          <div class="${cardClass}" id="card-${item.id}">
            <div class="card-header">
              <div class="card-title-wrap">
                ${!item.saved ? `<input type="checkbox" onchange="toggleItemSelection(${item.id}, this.checked)" ${item.selected ? 'checked' : ''}>` : '✅'}
                <h4>#${displayNumber}. ${data.shipment_external_id || 'Data Valid'}</h4>
              </div>
              ${!item.saved ? `<button class="btn-delete" onclick="deleteItem(${item.id})" title="Hapus">🗑️</button>` : ''}
            </div>
            
            <div class="info-table">${infoRowsHTML}</div>

            ${item.saved ? '<p style="color:green; font-weight:bold; margin: 10px 0 0 0; text-align:center; font-size:13px;">Telah Disimpan ke Paxel</p>' : ''}
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // --- PROSES SIMPAN MASSAL (BULK SAVE) ---

    async function saveSelectedItems() {
      const itemsToSave = scannedHistory.filter(x => !x.saved && x.selected);
      if (itemsToSave.length === 0) return;

      const bulkDateValue = document.getElementById('bulkDate').value;
      if (!bulkDateValue) {
        alert("Pilih Tanggal Serah Terima terlebih dahulu!");
        return;
      }

      const btnSaveBulk = document.getElementById('btnSaveBulk');
      btnSaveBulk.disabled = true;
      btnSaveBulk.innerText = '💾 Menyimpan...';
      statusEl.innerText = `💾 Menyimpan ${itemsToSave.length} data ke Paxel...`;

      try {
        const payload = itemsToSave.map(item => ({
          selectedData: item.matchedData,
          tanggalSerahTerima: bulkDateValue // Menggunakan 1 tanggal yang sama untuk semua item
        }));

        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'saveBulk', items: payload }) 
        });
        
        const responseText = await response.text();
        let resData = JSON.parse(responseText);

        if (!response.ok || !resData.success) throw new Error(resData.message || "Gagal menyimpan.");

        // Tandai berhasil disimpan
        itemsToSave.forEach(item => { item.saved = true; item.selected = false; });
        statusEl.innerText = `🎉 Berhasil menyimpan ${itemsToSave.length} data ke Paxel!`;
        renderHistory();

      } catch (e) {
        alert('❌ Error: ' + e.message);
        statusEl.innerText = "❌ Gagal menyimpan data.";
      } finally {
        btnSaveBulk.innerText = '💾 Simpan Terpilih ke Paxel';
      }
    }
  </script>
</body>
</html>
