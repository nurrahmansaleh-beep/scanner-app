<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner DO Balik</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h3 { margin-top: 0; color: #1a73e8; }
    
    .camera-wrapper { position: relative; width: 100%; height: 260px; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; }
    
    /* Kotak Target */
    .scan-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; height: 50px; border: 3px solid #ff9800; border-radius: 8px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.45); pointer-events: none;
    }
    
    .btn-snap { background: #1a73e8; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; }
    .btn-snap:active { background: #1557b0; }
    .btn-snap:disabled { background: #ccc; cursor: not-allowed; }
    
    #status { font-weight: bold; margin: 15px 0 5px 0; color: #333; font-size: 14px; }
    
    /* Kotak Debugging Baru */
    #ocrDebug { font-size: 13px; color: #333; background: #fff; padding: 10px; border-radius: 8px; border: 2px dashed #ff9800; margin-top: 10px; display: none; }
    #debugCanvasImage { width: 100%; max-height: 80px; object-fit: contain; margin-top: 8px; border: 1px solid #ddd; }
    
    .result-card { background: #e8f0fe; border: 1px solid #1a73e8; padding: 15px; border-radius: 12px; text-align: left; margin-top: 15px; }
    .result-card h4 { margin: 0 0 8px 0; color: #1a73e8; }
    .btn-select { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h3>Scanner DO Balik</h3>
    <p style="font-size: 13px; color: #666;">Posisikan HP agak menjauh sedikit agar <b>fokus (tidak blur)</b>. Pas-kan ID di dalam kotak.</p>

    <!-- Kamera Web -->
    <div class="camera-wrapper">
      <video id="videoElement" autoplay playsinline></video>
      <div class="scan-box" id="scanBox"></div>
    </div>
    
    <!-- Tombol Potret -->
    <button class="btn-snap" id="btnSnap" onclick="takeSnapAndScan()">📸 POTRET & SCAN</button>

    <canvas id="canvasElement" style="display:none;"></canvas>

    <div id="status">Membuka kamera...</div>
    
    <!-- Tampilan Apa yang Dilihat oleh Sistem OCR -->
    <div id="ocrDebug">
      <b>Teks yang Terbaca:</b> <span id="debugText" style="color:#d9534f;">-</span><br>
      <small style="color:#666;">Potongan gambar yang dianalisa mesin:</small>
      <img id="debugCanvasImage" alt="Potongan OCR">
    </div>
    
    <div id="resultsContainer"></div>
  </div>

  <script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');
    const statusEl = document.getElementById('status');
    const ocrDebugEl = document.getElementById('ocrDebug');
    const debugTextEl = document.getElementById('debugText');
    const debugCanvasImage = document.getElementById('debugCanvasImage');
    const btnSnap = document.getElementById('btnSnap');
    const ctx = canvas.getContext('2d');

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15); 
      } catch (e) {}
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          // Memaksa resolusi tinggi dan auto-focus (jika HP mendukung)
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: "continuous" }] } 
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          statusEl.innerText = "🟢 Kamera siap. Posisikan ID lalu tekan tombol.";
        };
      } catch (err) {
        statusEl.innerText = "❌ Gagal membuka kamera.";
        btnSnap.disabled = true;
      }
    }

    async function takeSnapAndScan() {
      btnSnap.disabled = true;
      statusEl.innerText = "⚙️ Memotong gambar & membaca teks...";
      document.getElementById('resultsContainer').innerHTML = '';
      ocrDebugEl.style.display = 'none';

      // 1. Potong Tengah Berdasarkan Resolusi Asli Video (Sangat Akurat)
      const vW = video.videoWidth;
      const vH = video.videoHeight;
      
      // Ambil 75% lebar tengah dan 18% tinggi tengah (menyesuaikan bentuk kotak)
      const cropW = vW * 0.75; 
      const cropH = vH * 0.18;
      const cropX = (vW - cropW) / 2;
      const cropY = (vH - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;

      // 2. Tambahkan Filter Hitam-Putih & Kontras Tinggi agar teks tajam
      ctx.filter = 'grayscale(100%) contrast(200%) brightness(120%)';
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      
      const imageDataURL = canvas.toDataURL('image/jpeg', 1.0);
      
      // Tampilkan potongan gambar di layar agar User tahu apa yang dibaca mesin
      debugCanvasImage.src = imageDataURL;
      ocrDebugEl.style.display = 'block';

      try {
        // 3. OCR Tesseract
        const { data: { text } } = await Tesseract.recognize(imageDataURL, 'eng');
        const cleanReadText = text ? text.replace(/\n/g, ' ').trim() : '';

        debugTextEl.innerText = cleanReadText || "[Kosong]";

        if (!cleanReadText || cleanReadText.length < 3) {
          statusEl.innerText = "❌ Gagal baca. Posisikan sedikit menjauh agar kamera fokus.";
          btnSnap.disabled = false;
          return;
        }

        statusEl.innerText = "🔍 Mencari ID di Spreadsheet...";

        // 4. Kirim ke Server
        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'liveTextScan', ocrText: cleanReadText })
        });
        
        const resData = await response.json();

        if (resData.success && resData.matches && resData.matches.length > 0) {
          playBeepSound();
          statusEl.innerText = "⚡ Data Ditemukan!";
          renderResult(resData.matches[0]);
        } else {
          statusEl.innerText = "❌ ID tidak cocok dengan data GSheet.";
        }
      } catch (e) {
        statusEl.innerText = "❌ Gagal memproses gambar.";
      } finally {
        btnSnap.disabled = false;
      }
    }

    function renderResult(data) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = `
        <div class="result-card">
          <h4>✅ Match ID: ${data.shipment_external_id}</h4>
          <button class="btn-select" id="btnSave" onclick='saveToPaxel(${JSON.stringify(data)})'>Simpan ke Sheet Paxel</button>
        </div>
      `;
    }

    async function saveToPaxel(selectedData) {
      const btnSave = document.getElementById('btnSave');
      btnSave.disabled = true;
      statusEl.innerText = '💾 Menyimpan ke Paxel...';

      try {
        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'save', selectedData: selectedData })
        });

        const resData = await response.json();
        if (resData.success) {
          document.getElementById('resultsContainer').innerHTML = '<p style="color:green; font-weight:bold; font-size:16px;">🎉 Berhasil Disimpan ke Sheet Paxel!</p>';
          statusEl.innerText = "Siap memindai kode berikutnya.";
        } else {
          statusEl.innerText = '❌ Gagal menyimpan.';
          btnSave.disabled = false;
        }
      } catch (e) {
        statusEl.innerText = '❌ Gangguan koneksi.';
        btnSave.disabled = false;
      }
    }

    window.onload = startCamera;
  </script>
</body>
</html>
