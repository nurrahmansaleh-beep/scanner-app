<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Scanner DO Balik</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h3 { margin-top: 0; color: #1a73e8; }
    
    .camera-wrapper { position: relative; width: 100%; height: 260px; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; }
    
    .scan-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 75%; height: 40px; border: 3px solid #ff9800; border-radius: 6px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5); pointer-events: none;
    }
    
    .btn-main { background: #1a73e8; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; margin-bottom: 10px; }
    .btn-main:active { background: #1557b0; }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }
    
    #status { font-weight: bold; margin: 10px 0; color: #333; font-size: 14px; }
    
    #ocrDebug { font-size: 13px; color: #333; background: #fff; padding: 10px; border-radius: 8px; border: 2px dashed #ff9800; margin-top: 10px; display: none; }
    #debugCanvasImage { width: 100%; max-height: 60px; object-fit: contain; margin-top: 8px; border: 1px solid #ddd; }
    
    .result-card { background: #e8f0fe; border: 1px solid #1a73e8; padding: 15px; border-radius: 12px; text-align: left; margin-top: 15px; }
    .result-card h4 { margin: 0 0 12px 0; color: #1a73e8; font-size: 16px; }
    .btn-select { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 15px; }
    
    /* Tabel Informasi Kolom A - F */
    .info-table { background: white; padding: 12px; border-radius: 8px; font-size: 13px; border: 1px solid #cce5ff; margin-top: 5px; }
    .info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #e0e0e0; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #555; width: 45%; font-weight: 500; }
    .info-value { color: #111; width: 55%; font-weight: bold; text-align: right; word-break: break-word; }
  </style>
</head>
<body>

  <div class="container">
    <h3>Scanner DO Balik</h3>
    <p style="font-size: 13px; color: #666;">Aktifkan kamera, pas-kan ID di kotak oranye, lalu tekan potret.</p>

    <div class="camera-wrapper">
      <video id="videoElement" autoplay playsinline muted></video>
      <div class="scan-box" id="scanBox"></div>
    </div>
    
    <button class="btn-main" id="btnStart" onclick="startCamera()">📷 BUKA / AKTIFKAN KAMERA</button>
    <button class="btn-main" id="btnSnap" onclick="takeSnapAndScan()" style="display:none; background:#28a745;">📸 POTRET & SCAN</button>

    <canvas id="canvasElement" style="display:none;"></canvas>

    <div id="status">Tekan tombol biru untuk mengaktifkan kamera.</div>
    
    <div id="ocrDebug">
      <b>Teks Hasil Saringan:</b> <span id="debugText" style="color:#28a745; font-weight:bold; font-size:16px;">-</span><br>
      <small style="color:#666;">Potongan gambar yang dianalisa mesin:</small>
      <img id="debugCanvasImage" alt="Potongan OCR">
    </div>
    
    <div id="resultsContainer"></div>
  </div>

  <script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');
    const statusEl = document.getElementById('status');
    const ocrDebugEl = document.getElementById('ocrDebug');
    const debugTextEl = document.getElementById('debugText');
    const debugCanvasImage = document.getElementById('debugCanvasImage');
    const btnStart = document.getElementById('btnStart');
    const btnSnap = document.getElementById('btnSnap');
    const ctx = canvas.getContext('2d');
    
    let currentStream = null;
    let currentMatchedData = null;

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15); 
      } catch (e) {}
    }

    // Fungsi Pengaktif Kamera Multi-Skenario Ringan & Tanpa Crash
    async function startCamera() {
      statusEl.innerText = "⌛ Meminta akses kamera...";
      btnStart.disabled = true;

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      // Daftar konfigurasi dari yang spesifik ke yang paling sederhana
      const tryConstraints = [
        { video: { facingMode: "environment" } }, // Kamera belakang standar
        { video: { facingMode: "user" } },        // Fallback: kamera depan (jika belakang error)
        { video: true }                            // Fallback: kamera apa saja yang aktif
      ];

      let stream = null;
      let lastErr = null;

      for (let constraints of tryConstraints) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break; // Berhasil, keluar dari percobaan
        } catch (err) {
          lastErr = err;
        }
      }

      if (!stream) {
        btnStart.disabled = false;
        statusEl.innerText = "❌ Kamera gagal: " + (lastErr ? lastErr.message : "Tidak diizinkan") + ". Coba restart Chrome atau izinkan kamera!";
        return;
      }

      try {
        currentStream = stream;
        video.srcObject = stream;
        // Penanganan play() yang didukung oleh semua device
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play().then(resolve).catch(resolve);
          };
        });
        
        statusEl.innerText = "🟢 Kamera aktif! Posisikan ID di kotak, lalu tekan POTRET.";
        btnStart.style.display = 'none';
        btnSnap.style.display = 'block';
      } catch (err) {
        btnStart.disabled = false;
        statusEl.innerText = "❌ Gagal memutar video kamera: " + err.message;
      }
    }

    async function takeSnapAndScan() {
      btnSnap.disabled = true;
      statusEl.innerText = "⚙️ Memotong gambar & membaca teks...";
      document.getElementById('resultsContainer').innerHTML = '';
      ocrDebugEl.style.display = 'none';

      const vW = video.videoWidth || 640;
      const vH = video.videoHeight || 480;
      const cropW = vW * 0.75; 
      const cropH = vH * 0.12;
      const cropX = (vW - cropW) / 2;
      const cropY = (vH - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;

      ctx.filter = 'grayscale(100%) contrast(250%) brightness(130%)';
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      
      const imageDataURL = canvas.toDataURL('image/jpeg', 0.9);
      debugCanvasImage.src = imageDataURL;
      ocrDebugEl.style.display = 'block';

      try {
        const { data: { text } } = await Tesseract.recognize(imageDataURL, 'eng');
        let rawText = text ? text.replace(/\n/g, ' ').trim() : '';

        let cleanIdText = "";
        const idPattern = rawText.match(/[A-Z0-9\-]{5,}/g);
        if (idPattern && idPattern.length > 0) {
          cleanIdText = idPattern[0];
        }

        debugTextEl.innerText = cleanIdText || "[Tidak ada ID Valid]";

        if (!cleanIdText) {
          statusEl.innerText = "❌ ID tidak terbaca. Pastikan foto tidak blur.";
          btnSnap.disabled = false;
          return;
        }

        statusEl.innerText = "🔍 Mencari ID di Spreadsheet...";

        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'liveTextScan', ocrText: cleanIdText })
        });
        
        const responseText = await response.text();
        let resData;
        try {
          resData = JSON.parse(responseText);
        } catch(e) {
          throw new Error("Server Error");
        }

        if (!response.ok || !resData.success) {
          throw new Error(resData.message || "Gagal memproses data.");
        }

        if (resData.matches && resData.matches.length > 0) {
          playBeepSound();
          statusEl.innerText = "⚡ Data Ditemukan!";
          renderResult(resData.matches[0]);
        } else {
          statusEl.innerText = "❌ ID (" + cleanIdText + ") tidak ada di Master Data.";
        }
      } catch (e) {
        statusEl.innerText = "❌ Error: " + e.message;
      } finally {
        btnSnap.disabled = false;
      }
    }

    // Fungsi Render Tampilan untuk Menampilkan Kolom A-F (6 Kolom Pertama)
    function renderResult(data) {
      currentMatchedData = data; 
      
      // Mengambil 6 kolom paling awal dari hasil respons spreadsheet
      const firstSixColumns = Object.entries(data).slice(0, 6);
      
      let infoRowsHTML = '';
      firstSixColumns.forEach(([headerName, value]) => {
        if (headerName && headerName.trim() !== '') {
          infoRowsHTML += `
            <div class="info-row">
              <div class="info-label">${headerName}</div>
              <div class="info-value">${value || '-'}</div>
            </div>
          `;
        }
      });

      const container = document.getElementById('resultsContainer');
      container.innerHTML = `
        <div class="result-card">
          <h4>✅ Match ID: ${data.shipment_external_id || 'Data Ditemukan'}</h4>
          <div class="info-table">
            ${infoRowsHTML}
          </div>
          <button class="btn-select" id="btnSave" onclick="saveToPaxel()">Simpan ke Sheet Paxel</button>
        </div>
      `;
    }

    async function saveToPaxel() {
      const btnSave = document.getElementById('btnSave');
      btnSave.disabled = true;
      statusEl.innerText = '💾 Menyimpan ke Paxel...';

      try {
        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'save', selectedData: currentMatchedData })
        });
        
        const responseText = await response.text();
        let resData = JSON.parse(responseText);

        if (!response.ok || !resData.success) {
          throw new Error(resData.message || "Gagal menyimpan ke Sheet Paxel.");
        }

        document.getElementById('resultsContainer').innerHTML = '<p style="color:green; font-weight:bold; font-size:16px; text-align:center;">🎉 Berhasil Disimpan ke Sheet Paxel!</p>';
        statusEl.innerText = "Siap memindai kode berikutnya.";
      } catch (e) {
        statusEl.innerText = '❌ Error: ' + e.message;
        btnSave.disabled = false;
      }
    }
  </script>
</body>
</html>
