<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Scanner DO Balik</title>
  
  <!-- Tesseract untuk OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <!-- SheetJS untuk Export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h3 { margin-top: 0; color: #1a73e8; margin-bottom: 5px; }
    
    .camera-wrapper { position: relative; width: 100%; height: 240px; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; }
    
    .scan-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 75%; height: 40px; border: 3px solid #ff9800; border-radius: 6px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5); pointer-events: none;
    }
    
    .btn-main { background: #1a73e8; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; margin-bottom: 10px; }
    .btn-main:active { background: #1557b0; }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }
    
    #status { font-weight: bold; margin: 10px 0; color: #333; font-size: 14px; }
    
    #ocrDebug { font-size: 13px; color: #333; background: #fff; padding: 10px; border-radius: 8px; border: 2px dashed #ff9800; margin-top: 10px; display: none; }
    #debugCanvasImage { width: 100%; max-height: 50px; object-fit: contain; margin-top: 6px; border: 1px solid #ddd; }
    
    .history-title { text-align: left; margin: 20px 0 10px 0; font-size: 16px; color: #333; border-bottom: 2px solid #1a73e8; padding-bottom: 5px; font-weight:bold; display: flex; justify-content: space-between; align-items: center; }
    
    /* Panel Kontrol Massal dengan Vendor */
    .bulk-controls { display: flex; flex-direction: column; gap: 10px; background: #fff; border: 1px solid #cce5ff; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
    .input-wrap { display: flex; align-items: center; justify-content: space-between; background: #f0f7ff; padding: 8px 10px; border-radius: 8px; border: 1px solid #b8daff; }
    .input-wrap label { font-size: 12px; font-weight: bold; color: #1a73e8; }
    .input-wrap input { font-family: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; background: #fff; color:#333; width: 55%; }
    
    .bulk-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
    .select-all-wrap { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #333; cursor: pointer; }
    .select-all-wrap input { width: 18px; height: 18px; cursor: pointer; }
    
    .btn-save-bulk { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-save-bulk:disabled { background: #a5d8b2; cursor: not-allowed; }
    
    .btn-export { background: #ff9800; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; display: none; }
