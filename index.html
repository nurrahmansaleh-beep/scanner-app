<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Text Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h3 { margin-top: 0; color: #1a73e8; }
    
    /* Viewfinder Kamera dengan Overlay Kotak Fokus */
    .camera-wrapper { position: relative; width: 100%; height: 260px; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 10px; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; }
    
    /* Kotak Target Merah/Hijau di Tengah */
    .scan-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; height: 70px; border: 3px solid #ff9800; border-radius: 8px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.4); pointer-events: none;
    }
    
    #status { font-weight: bold; margin: 10px 0; color: #333; font-size: 14px; }
    
    .result-card { background: #e8f0fe; border: 1px solid #1a73e8; padding: 15px; border-radius: 12px; text-align: left; margin-top: 15px; }
    .result-card h4 { margin: 0 0 8px 0; color: #1a73e8; }
    .btn-select { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
    .btn-restart { background: #ff9800; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h3>Scanner Teks Otomatis</h3>
    <p style="font-size: 13px; color: #666;">Posisikan kode ID (seperti E2M96L-3880) pas di dalam <b>KOTAK ORANYE</b>.</p>

    <div class="camera-wrapper">
      <video id="videoElement" autoplay playsinline></video>
      <div class="scan-box" id="scanBox"></div>
    </div>
    
    <canvas id="canvasElement" style="display:none;"></canvas>

    <div id="status">Mempersiapkan kamera...</div>
    <div id="resultsContainer"></div>
    <button id="btnRestart" class="btn-restart" style="display:none;" onclick="resumeScanning()">Mulai Ulang Scanner</button>
  </div>

  <script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');
    const statusEl = document.getElementById('status');
    const scanBox = document.getElementById('scanBox');
    const ctx = canvas.getContext('2d');
    
    let isProcessing = false;
    let scanInterval;

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15); 
      } catch (e) {}
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => { startAutoScan(); };
      } catch (err) {
        statusEl.innerText = "❌ Gagal membuka kamera.";
      }
    }

    function startAutoScan() {
      statusEl.innerText = "🟢 Posisikan teks di dalam kotak...";
      scanBox.style.borderColor = "#ff9800";
      isProcessing = false;
      document.getElementById('btnRestart').style.display = 'none';
      
      scanInterval = setInterval(async () => {
        if (isProcessing) return;
        isProcessing = true;
        
        // POTONG HANYA AREA KOTAK TENGAH (CROP)
        const vW = video.videoWidth;
        const vH = video.videoHeight;
        
        // Area crop 70% lebar dan 25% tinggi di tengah kamera
        const cropW = vW * 0.75;
        const cropH = vH * 0.25;
        const cropX = (vW - cropW) / 2;
        const cropY = (vH - cropH) / 2;

        canvas.width = cropW;
        canvas.height = cropH;

        // Gambar hanya bagian kotak fokus
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        const imageDataURL = canvas.toDataURL('image/jpeg', 0.8);

        statusEl.innerText = "⚙️ Menganalisa area kotak...";

        try {
          const { data: { text } } = await Tesseract.recognize(imageDataURL, 'eng');
          
          if (!text || text.trim().length < 3) {
            statusEl.innerText = "🟢 Posisikan teks di dalam kotak...";
            isProcessing = false;
            return;
          }

          const response = await fetch('/api/process', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'liveTextScan', ocrText: text })
          });
          
          const resData = await response.json();

          if (resData.success && resData.matches && resData.matches.length > 0) {
            clearInterval(scanInterval);
            playBeepSound();
            scanBox.style.borderColor = "#28a745"; // Ubah kotak jadi hijau jika berhasil
            statusEl.innerText = "⚡ Data Ditemukan!";
            renderResult(resData.matches[0]);
          } else {
             statusEl.innerText = "🟢 Memindai...";
             isProcessing = false;
          }
        } catch (e) {
          statusEl.innerText = "🟢 Memindai...";
          isProcessing = false;
        }
      }, 2500); 
    }

    function renderResult(data) {
      document.getElementById('btnRestart').style.display = 'inline-block';
      const container = document.getElementById('resultsContainer');
      container.innerHTML = `
        <div class="result-card">
          <h4>✅ Match ID: ${data.shipment_external_id}</h4>
          <button class="btn-select" onclick='saveToPaxel(${JSON.stringify(data)})'>Simpan ke Sheet Paxel</button>
        </div>
      `;
    }

    function resumeScanning() {
       document.getElementById('resultsContainer').innerHTML = '';
       startAutoScan();
    }

    async function saveToPaxel(selectedData) {
      statusEl.innerText = '💾 Menyimpan ke Paxel...';
      try {
        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'save', selectedData: selectedData })
        });

        const resData = await response.json();
        if (resData.success) {
          document.getElementById('resultsContainer').innerHTML = '<p style="color:green; font-weight:bold;">🎉 Berhasil Disimpan!</p>';
          setTimeout(() => { resumeScanning(); }, 2000);
        }
      } catch (e) {
        statusEl.innerText = '❌ Gagal menyimpan.';
      }
    }

    window.onload = startCamera;
  </script>
</body>
</html>
