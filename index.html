<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Scanner DO Balik</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h3 { margin-top: 0; color: #1a73e8; }
    
    .camera-wrapper { position: relative; width: 100%; height: 260px; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 15px; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; }
    
    .scan-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 75%; height: 40px; border: 3px solid #ff9800; border-radius: 6px;
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5); pointer-events: none;
    }
    
    .btn-main { background: #1a73e8; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; margin-bottom: 10px; }
    .btn-main:active { background: #1557b0; }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }
    
    #status { font-weight: bold; margin: 10px 0; color: #333; font-size: 14px; }
    
    #ocrDebug { font-size: 13px; color: #333; background: #fff; padding: 10px; border-radius: 8px; border: 2px dashed #ff9800; margin-top: 10px; display: none; }
    #debugCanvasImage { width: 100%; max-height: 60px; object-fit: contain; margin-top: 8px; border: 1px solid #ddd; }
    
    .result-card { background: #e8f0fe; border: 1px solid #1a73e8; padding: 15px; border-radius: 12px; text-align: left; margin-top: 15px; }
    .result-card h4 { margin: 0 0 12px 0; color: #1a73e8; font-size: 16px; }
    .btn-select { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 15px; }
    
    /* Style Tabel Informasi */
    .info-table { background: white; padding: 12px; border-radius: 8px; font-size: 13px; border: 1px solid #cce5ff; }
    .info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #e0e0e0; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #555; width: 45%; }
    .info-value { color: #111; width: 55%; font-weight: bold; text-align: right; word-break: break-word; }
  </style>
</head>
<body>

  <div class="container">
    <h3>Scanner DO Balik</h3>
    <p style="font-size: 13px; color: #666;">Aktifkan kamera, pas-kan ID di kotak oranye, lalu tekan potret.</p>

    <div class="camera-wrapper">
      <video id="videoElement" autoplay playsinline muted></video>
      <div class="scan-box" id="scanBox"></div>
    </div>
    
    <button class="btn-main" id="btnStart" onclick="startCamera()">📷 BUKA / AKTIFKAN KAMERA</button>
    <button class="btn-main" id="btnSnap" onclick="takeSnapAndScan()" style="display:none; background:#28a745;">📸 POTRET & SCAN</button>

    <canvas id="canvasElement" style="display:none;"></canvas>

    <div id="status">Tekan tombol biru untuk mengaktifkan kamera.</div>
    
    <div id="ocrDebug">
      <b>Teks Hasil Saringan:</b> <span id="debugText" style="color:#28a745; font-weight:bold; font-size:16px;">-</span><br>
      <small style="color:#666;">Potongan gambar yang dianalisa mesin:</small>
      <img id="debugCanvasImage" alt="Potongan OCR">
    </div>
    
    <div id="resultsContainer"></div>
  </div>

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15); 
      } catch (e) {}
    }
