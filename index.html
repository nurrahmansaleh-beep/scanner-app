<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner DO Balik</title>
  <!-- Library pembaca teks (Tesseract) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 480px; margin: 0 auto; background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h3 { margin-top: 0; color: #1a73e8; }
    
    /* Area upload foto */
    .btn-camera-label {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #e8f0fe; border: 2px dashed #1a73e8; border-radius: 12px;
      padding: 30px 15px; margin: 15px 0; cursor: pointer; color: #1a73e8; font-weight: bold;
    }
    .btn-camera-label:active { background: #d2e3fc; }
    .btn-camera-label span { font-size: 14px; color: #555; margin-top: 5px; font-weight: normal; }
    
    #fileInput { display: none; }
    
    /* Preview Gambar */
    #previewImage { width: 100%; border-radius: 12px; margin-top: 15px; display: none; max-height: 200px; object-fit: contain; border: 1px solid #ddd;}
    
    #status { font-weight: bold; margin: 15px 0; color: #333; font-size: 14px; }
    #ocrDebug { font-size: 12px; color: #666; background: #f8f9fa; padding: 8px; border-radius: 6px; border: 1px dashed #ccc; margin-top: 5px; word-break: break-all; display: none;}
    
    /* Card Hasil Pencarian */
    .result-card { background: #e8f0fe; border: 1px solid #1a73e8; padding: 15px; border-radius: 12px; text-align: left; margin-top: 15px; }
    .result-card h4 { margin: 0 0 8px 0; color: #1a73e8; }
    .btn-select { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
    .btn-select:active { background: #1e7e34; }
    
    button:disabled { background: #ccc !important; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    <h3>Scanner DO Balik</h3>
    <p style="font-size: 13px; color: #666;">Ambil foto dokumen/DO yang berisi kode ID unik Anda.</p>

    <!-- Label pemicu kamera asli bawaan HP -->
    <label for="fileInput" class="btn-camera-label" id="cameraLabel">
      <span style="font-size: 40px;">📸</span>
      AMBIL FOTO / SCAN DOKUMEN
      <span>Klik untuk membuka kamera HP</span>
    </label>
    
    <!-- Input Kamera tersembunyi -->
    <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="onFileSelected()">
    
    <!-- Pratinjau Foto -->
    <img id="previewImage" alt="Preview Foto">

    <div id="status">Siap digunakan. Silakan ambil foto.</div>
    <div id="ocrDebug"></div>
    
    <div id="resultsContainer"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const previewImage = document.getElementById('previewImage');
    const statusEl = document.getElementById('status');
    const ocrDebugEl = document.getElementById('ocrDebug');
    const resultsContainer = document.getElementById('resultsContainer');
    const cameraLabel = document.getElementById('cameraLabel');

    function playBeepSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15); 
      } catch (e) {}
    }

    async function onFileSelected() {
      const file = fileInput.files[0];
      if (!file) return;

      // 1. Tampilkan preview gambar
      previewImage.src = URL.createObjectURL(file);
      previewImage.style.display = 'block';
      
      resultsContainer.innerHTML = '';
      statusEl.innerText = "⚙️ Membaca teks di foto...";
      ocrDebugEl.style.display = 'none';
      
      // Matikan tombol sementara proses membaca
      cameraLabel.style.pointerEvents = 'none';
      cameraLabel.style.opacity = '0.6';

      try {
        // 2. OCR Menggunakan library Tesseract
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        const cleanReadText = text ? text.trim() : '';

        // Tampilkan teks debug
        ocrDebugEl.innerText = "Hasil Baca Kamera:\n" + (cleanReadText || "[Tidak ada teks terbaca]");
        ocrDebugEl.style.display = 'block';

        if (!cleanReadText || cleanReadText.length < 3) {
          statusEl.innerText = "❌ Tidak dapat membaca tulisan. Ambil foto yang lebih dekat dan terang.";
          resetButtons();
          return;
        }

        statusEl.innerText = "🔍 Mencari kecocokan di Master Data...";

        // 3. Kirim ke API backend untuk dicocokkan dengan Master Data
        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'liveTextScan', ocrText: cleanReadText })
        });
        
        const resData = await response.json();

        if (resData.success && resData.matches && resData.matches.length > 0) {
          playBeepSound();
          statusEl.innerText = "⚡ Data Ditemukan!";
          renderResult(resData.matches[0]);
        } else {
          statusEl.innerText = "❌ ID Tidak Ditemukan di Spreadsheet. Coba foto lebih dekat.";
          resetButtons();
        }

      } catch (e) {
        statusEl.innerText = "❌ Terjadi error saat membaca foto.";
        resetButtons();
      }
    }

    function resetButtons() {
      cameraLabel.style.pointerEvents = 'auto';
      cameraLabel.style.opacity = '1';
    }

    function renderResult(data) {
      resetButtons();
      resultsContainer.innerHTML = `
        <div class="result-card">
          <h4>✅ Ditemukan: ${data.shipment_external_id}</h4>
          <p style="font-size:12px; color:#555;">Klik tombol di bawah untuk menyimpan ke worksheet Paxel.</p>
          <button class="btn-select" id="btnSave" onclick='saveToPaxel(${JSON.stringify(data)})'>Simpan ke Sheet Paxel</button>
        </div>
      `;
    }

    async function saveToPaxel(selectedData) {
      const btnSave = document.getElementById('btnSave');
      btnSave.disabled = true;
      statusEl.innerText = '💾 Menyimpan ke Paxel...';

      try {
        const response = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'save', selectedData: selectedData })
        });

        const resData = await response.json();
        if (resData.success) {
          resultsContainer.innerHTML = '<p style="color:green; font-weight:bold; font-size:16px;">🎉 Berhasil Disimpan ke Sheet Paxel!</p>';
          statusEl.innerText = "Siap untuk scan berikutnya.";
          
          // Sembunyikan preview
          setTimeout(() => {
            previewImage.style.display = 'none';
            ocrDebugEl.style.display = 'none';
          }, 3000);
        } else {
          statusEl.innerText = '❌ Gagal menyimpan ke Spreadsheet.';
          btnSave.disabled = false;
        }
      } catch (e) {
        statusEl.innerText = '❌ Gagal menghubungi server.';
        btnSave.disabled = false;
      }
    }
  </script>
</body>
</html>
